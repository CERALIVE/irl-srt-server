name: Build Check

on:
  push:
    branches: [upstream/main]
  pull_request:
    branches: [upstream/main]

# Least-privilege default; jobs escalate only what they need.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # The production Dockerfile is the single source of truth for the build: it
      # builds libsrt from the pinned CERALIVE/srt commit and links irl-srt-server
      # against it, so the image runs the same libsrt the device runs. Exercising
      # `docker build` here keeps CI from ever drifting from how the image is
      # actually produced.
      # --load imports the image into the local daemon so the verify steps'
      # `docker run` can find it; GHA layer cache makes reruns cheap.
      - name: Build production image
        run: >-
          docker buildx build --load --tag irl-srt-server:ci
          --cache-from type=gha --cache-to type=gha,mode=max .

      - name: Verify shipped binary
        run: |
          docker run --rm --entrypoint sh irl-srt-server:ci -c \
            'ls -l /usr/local/bin/srt_server'

      # Assert the image links the CERALIVE/srt pin, not a stock libsrt. Two
      # independent signals from one real boot: the libsrt version banner, and the
      # SRTLA publisher listener coming up with `srtla_patches=on` — which can only
      # happen if srt_setsockopt accepted SRTO_SRTLAPATCHES, an option no stock
      # Haivision build defines. The absence of the setsockopt failure line is
      # asserted explicitly so a future log-level change cannot turn a real failure
      # into a silent pass.
      # The shipped sls.conf carries CRLF line endings that the conf parser rejects,
      # so it is normalized into a scratch copy before booting. timeout's SIGTERM is
      # handled as a clean shutdown, so libc flushes the captured stdout.
      - name: Verify the image links the pinned CERALIVE libsrt
        run: |
          docker run --rm --entrypoint sh irl-srt-server:ci -c '
            sed "s/\r$//" /etc/sls/sls.conf > /tmp/sls.conf
            timeout 6 srt_server -c /tmp/sls.conf > /tmp/boot.log 2>&1 || true
            cat /tmp/boot.log
            grep -q "Initialized libsrt v1.5.7" /tmp/boot.log
            grep -q "srtla_patches=on" /tmp/boot.log
            ! grep -q "SRTO_SRTLAPATCHES failure" /tmp/boot.log
          '

      # Fail the build on any HIGH/CRITICAL OS/library CVE in the produced
      # image. ignore-unfixed keeps the gate on actionable (patch-available)
      # findings so an unfixable upstream base CVE cannot wedge the merge.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: irl-srt-server:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Publish a CycloneDX SBOM of the produced image as a build artifact for
      # supply-chain provenance. One per arch leg to avoid name collisions.
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: irl-srt-server:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.arch }}.cdx.json
          artifact-name: sbom-${{ matrix.arch }}.cdx.json
          upload-artifact: true

  # Advisory CodeQL pass. The C++ build is libsrt-dependent and lives in the
  # Dockerfile, so we analyze in no-build mode (build-mode: none) to surface
  # findings without replicating the production build. continue-on-error keeps
  # a fresh baseline of pre-existing findings from ever wedging the merge gate.
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: c-cpp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          category: "/language:c-cpp"
