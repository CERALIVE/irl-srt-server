name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: repository contracts
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check external action references are resolvable
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-action-refs.sh

      - name: Check tracked workspace evidence boundary
        run: bash scripts/check-tracked-workspace-evidence.sh

      - name: Check srt build-input pins agree
        run: bash scripts/check-srt-pin.sh

      - name: Check immutable image publication contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-image-publish-contracts.sh

  build-and-test:
    name: ${{ matrix.config }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      # CERALIVE/srt @ tag srt-v1.5.7+ceralive.2 (Haivision v1.5.7 carrying the
      # CERALIVE SRTO_PERIODICNAKGATE and SRTO_SRTLAPATCHES socket options), pinned
      # by commit and built exactly as the Dockerfile does. Keep in lockstep with the
      # Dockerfile ARG SRT_COMMIT and the fuzz/coverage jobs' SRT_COMMIT so every
      # canonical leg links the production libsrt.
      # scripts/check-srt-pin.sh asserts all four pin sites agree.
      SRT_COMMIT: d487b13365205b6cd5da9d9b50868c323e255b7c
    strategy:
      fail-fast: false
      matrix:
        include:
          # Canonical legs: build the production CERALIVE/srt and run the full ctest
          # suite under a plain debug build and each sanitizer flavor.
          - config: debug
            cmake_flags: ""
            srt: ceralive
            run_tests: true
          - config: asan-ubsan
            cmake_flags: "-DSLS_SANITIZE=ON"
            srt: ceralive
            run_tests: true
          - config: tsan
            cmake_flags: "-DSLS_TSAN=ON"
            srt: ceralive
            run_tests: true
          # EXPECTED-INCOMPATIBILITY leg. src/core/SLSSrt.cpp references
          # SRTO_SRTLAPATCHES unconditionally and this fork keeps the server source
          # byte-identical to upstream, so a stock Haivision libsrt build MUST fail to
          # compile. The leg passes only on that failure; see the step body.
          - config: stock-libsrt-expected-incompatible
            cmake_flags: ""
            srt: stock
            run_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake tcl pkg-config \
            libssl-dev zlib1g-dev ccache

      - name: Install e2e harness tooling
        if: matrix.config == 'debug'
        run: sudo apt-get install -y ffmpeg jq curl

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.config }}-gcc-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.config }}-gcc-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      # --- Stock libsrt (apt). Jammy ships the OpenSSL crypto variant as
      #     libsrt-openssl-dev (there is no plain libsrt-dev meta-package on 22.04);
      #     it matches this project's OpenSSL linkage and installs to the default
      #     system include/lib search paths.
      - name: Install stock libsrt (apt)
        if: matrix.srt == 'stock'
        run: |
          sudo apt-get install -y libsrt-openssl-dev
          pkg-config --modversion srt
          # Prove the header that will resolve is the STOCK one and carries no
          # SRTLA option, so a compile failure below cannot be blamed on the wrong
          # libsrt being picked up from a leftover /usr/local install.
          test ! -e /usr/local/include/srt/srt.h
          ! grep -q 'SRTO_SRTLAPATCHES' /usr/include/srt/srt.h

      # --- CERALIVE/srt, built exactly like the Dockerfile (./configure && make &&
      #     make install). Cache key is RE-KEYED on the pinned CERALIVE commit so it
      #     only rebuilds when SRT_COMMIT changes.
      - name: Cache SRT CERALIVE build
        if: matrix.srt == 'ceralive'
        id: cache-srt-ceralive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/srt-ceralive
          key: srt-ceralive-${{ runner.os }}-${{ env.SRT_COMMIT }}

      - name: Build SRT CERALIVE fork
        if: matrix.srt == 'ceralive' && steps.cache-srt-ceralive.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/CERALIVE/srt.git /tmp/srt
          cd /tmp/srt
          git checkout ${SRT_COMMIT}
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=/usr/local/srt-ceralive
          make -j$(nproc)
          sudo make install

      - name: Expose CERALIVE SRT to the build
        if: matrix.srt == 'ceralive'
        run: |
          echo "CPATH=/usr/local/srt-ceralive/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/srt-ceralive/lib/pkgconfig" >> $GITHUB_ENV

      - name: Cache vendored libs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lib
          key: vendor-libs-${{ hashFiles('.gitmodules') }}-${{ hashFiles('lib/**/.git') }}

      # CI-only -Werror gate. Scoped to high-signal, already-clean categories
      # (missing return = UB; format-string = CWE-134) rather than a blanket
      # -Werror, because the tree still carries pre-existing -Wall/-Wextra
      # warnings (unused/shadow/missing-field-init). Kept out of CMakeLists so
      # local dev builds are not blocked by them.
      - name: Configure (${{ matrix.config }})
        if: matrix.srt != 'stock'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSLS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-Werror=return-type -Werror=format-security -Werror=nonnull -Werror=address -Werror=sizeof-pointer-memaccess" \
            ${{ matrix.cmake_flags }}

      - name: Build
        if: matrix.srt != 'stock'
        run: cmake --build build -j

      # EXPECTED INCOMPATIBILITY. This leg asserts a NEGATIVE: the unmodified
      # upstream server source cannot be built against stock Haivision libsrt,
      # because src/core/SLSSrt.cpp names SRTO_SRTLAPATCHES with no fallback and
      # this fork deliberately does NOT carry a compat shim in its own source —
      # the compat enumerator lives in CERALIVE/srt instead. If this step ever
      # starts succeeding, either a source-level fallback was smuggled in or a
      # non-stock libsrt leaked onto the include path; both must fail the build.
      #
      # Ordering is load-bearing: `set -o pipefail` plus an explicit capture of the
      # compiler's exit status BEFORE any grep, so a build that actually SUCCEEDED
      # can never be read as a pass just because the log happens to mention the
      # enumerator. GCC says "was not declared in this scope", clang says "use of
      # undeclared identifier"; the pattern accepts either.
      - name: Build against stock libsrt (must FAIL to compile)
        if: matrix.srt == 'stock'
        run: |
          set -o pipefail
          cmake -S . -B build-stock \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSLS_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          set +e
          cmake --build build-stock -j 2>&1 | tee build-stock.log
          build_status=${PIPESTATUS[0]}
          set -e
          echo "stock-libsrt build exit status = ${build_status}"
          if [ "${build_status}" -eq 0 ]; then
            echo "::error::the stock-libsrt build SUCCEEDED; SRTO_SRTLAPATCHES is no longer load-bearing (a source fallback or a non-stock libsrt leaked in)."
            exit 1
          fi
          grep -q 'SRTO_SRTLAPATCHES' build-stock.log
          grep -Eiq 'undeclared|not declared|no member' build-stock.log
          echo "expected incompatibility confirmed: stock libsrt cannot provide SRTO_SRTLAPATCHES."

      - name: Upload stock-libsrt incompatibility log
        if: always() && matrix.srt == 'stock'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stock-libsrt-build-log
          path: build-stock.log
          if-no-files-found: ignore

      - name: Test
        if: matrix.run_tests
        run: ctest --test-dir build --output-on-failure

      - name: Stats-snapshot (verify control-plane API shape)
        if: matrix.config == 'debug'
        run: |
          SRT_SERVER="$PWD/build/bin/srt_server" \
          SRT_CLIENT="$PWD/build/bin/srt_client" \
            bash tests/e2e/stats_snapshot.sh

      - name: Reconnect-replay (viewer survives publisher restart without replay)
        if: matrix.config == 'debug'
        run: |
          SRT_SERVER="$PWD/build/bin/srt_server" \
          SRT_CLIENT="$PWD/build/bin/srt_client" \
            bash tests/e2e/reconnect_replay.sh

      - name: Publisher-auth probation (silent callers remain bounded)
        if: matrix.config == 'debug'
        run: |
          SRT_SERVER="$PWD/build/bin/srt_server" \
          SRT_LIVE_TRANSMIT="/usr/local/srt-ceralive/bin/srt-live-transmit" \
            bash tests/e2e/publisher_auth_probation.sh

  # Baselined clang-tidy gate. The tree carries pre-existing findings, so a blanket
  # gate would wedge every PR. Instead we run a full informational pass (the
  # baseline, non-blocking) AND a clang-tidy-diff gate that fails ONLY on NEW
  # findings introduced on lines changed since the merge-base. The .clang-tidy check
  # list is the single source of truth and is NOT expanded here.
  clang-tidy:
    name: clang-tidy (static analysis)
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history so the diff gate can find the merge-base

      - name: Install build + clang tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake tcl pkg-config \
            libssl-dev zlib1g-dev \
            clang clang-tidy curl ccache
          # Version-matched run-clang-tidy / clang-tidy-diff helpers (single-file
          # Python scripts, no extra deps) pulled from the matching LLVM release
          # so the local and CI invocations stay identical in form.
          TIDY_MAJOR=$(clang-tidy --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d. -f1)
          echo "clang-tidy major version: $TIDY_MAJOR"
          for f in run-clang-tidy clang-tidy-diff; do
            sudo curl -fsSL -o /usr/local/bin/$f.py \
              "https://raw.githubusercontent.com/llvm/llvm-project/release/${TIDY_MAJOR}.x/clang-tools-extra/clang-tidy/tool/$f.py"
            sudo chmod +x /usr/local/bin/$f.py
          done

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-clang-tidy-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-tidy-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      # SRT headers must be the SAME CERALIVE/srt the canonical legs link, or every
      # translation unit's SRTO_SRTLAPATCHES reference becomes a spurious
      # clang-diagnostic-error. The commit is READ FROM THE DOCKERFILE rather than
      # duplicated as a fourth SRT_COMMIT env site, so the pin can never drift here
      # and scripts/check-srt-pin.sh keeps counting exactly three ci.yml sites.
      - name: Resolve the pinned CERALIVE SRT commit
        id: srt-pin
        run: |
          SHA=$(sed -n 's/^ARG SRT_COMMIT=\([0-9a-f]\{40\}\).*/\1/p' Dockerfile)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache SRT CERALIVE build
        id: cache-srt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/srt-ceralive
          key: srt-ceralive-${{ runner.os }}-${{ steps.srt-pin.outputs.sha }}

      - name: Build SRT CERALIVE fork
        if: steps.cache-srt.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/CERALIVE/srt.git /tmp/srt
          cd /tmp/srt
          git checkout ${{ steps.srt-pin.outputs.sha }}
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=/usr/local/srt-ceralive
          make -j$(nproc)
          sudo make install

      - name: Expose SRT to the build
        run: |
          echo "CPATH=/usr/local/srt-ceralive/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/srt-ceralive/lib/pkgconfig" >> $GITHUB_ENV

      - name: Cache vendored libs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lib
          key: vendor-libs-${{ hashFiles('.gitmodules') }}-${{ hashFiles('lib/**/.git') }}

      # Generate compile_commands.json with clang++ so the database carries
      # clang-parseable flags (no GCC-only -fcompare-debug-second, which would
      # otherwise surface as spurious clang-diagnostic-error). configure alone
      # emits the database — no compile/link required for analysis.
      - name: Configure (compile DB, clang)
        run: |
          cmake -S . -B build-tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSLS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          test -f build-tidy/compile_commands.json

      # Informational full run over src/core/*.cpp + src/*.cpp — the existing
      # findings baseline. Non-blocking.
      - name: clang-tidy (full, informational baseline)
        run: |
          python3 /usr/local/bin/run-clang-tidy.py -p build-tidy -quiet \
            'src/core/.*\.cpp' 'src/srt-live-.*\.cpp' \
            2>&1 | tee clang-tidy-full.log || true

      - name: Upload clang-tidy baseline log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clang-tidy-full-log
          path: clang-tidy-full.log
          if-no-files-found: ignore

      # Gate: fail ONLY on NEW findings on lines changed since the merge-base.
      # On a push to the default branch (merge-base == HEAD) the diff is empty
      # and the gate is a no-op; it bites on feature branches / PRs.
      - name: clang-tidy diff gate (new findings only)
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then BASE_REF="${{ github.event.repository.default_branch }}"; fi
          git fetch --no-tags origin "$BASE_REF" || true
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)
          if [ -z "$MERGE_BASE" ] || [ "$MERGE_BASE" = "$(git rev-parse HEAD)" ]; then
            echo "No base diff (merge-base unresolved or == HEAD); nothing new to gate."
            exit 0
          fi
          echo "Gating NEW clang-tidy findings on $MERGE_BASE..HEAD (base: $BASE_REF)"
          git diff -U0 "$MERGE_BASE" HEAD -- src/core src/srt-live-server.cpp src/srt-live-client.cpp \
            | python3 /usr/local/bin/clang-tidy-diff.py \
                -p1 -path build-tidy -clang-tidy-binary clang-tidy -quiet \
            2>&1 | tee clang-tidy-diff.log
          if grep -qE ': (warning|error):' clang-tidy-diff.log; then
            echo "::error::clang-tidy reported NEW findings on changed lines (see clang-tidy-diff.log)."
            exit 1
          fi
          echo "No new clang-tidy findings on changed lines."

  # Style gate, scoped to changed lines. The tree predates the formatter, so a
  # repo-wide `clang-format --dry-run --Werror` would be all noise; instead
  # `git clang-format --diff <merge-base>` checks only the lines this branch
  # touched. Restricted to src/ so vendored lib/ is never reformatted.
  clang-format:
    name: clang-format (style)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history so the diff can find the merge-base

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format git
          # Ubuntu ships the helper as git-clang-format-<ver>; expose the plain
          # name so `git clang-format` resolves it.
          if ! command -v git-clang-format >/dev/null; then
            GCF=$(ls /usr/bin/git-clang-format* 2>/dev/null | head -1)
            [ -n "$GCF" ] && sudo ln -sf "$GCF" /usr/local/bin/git-clang-format
          fi
          git clang-format -h >/dev/null 2>&1 && echo "git clang-format available"

      - name: clang-format check (changed lines in src/)
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then BASE_REF="${{ github.event.repository.default_branch }}"; fi
          git fetch --no-tags origin "$BASE_REF" || true
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)
          if [ -z "$MERGE_BASE" ] || [ "$MERGE_BASE" = "$(git rev-parse HEAD)" ]; then
            echo "No base diff (merge-base unresolved or == HEAD); nothing to check."
            exit 0
          fi
          echo "Checking clang-format on src/ lines changed since $MERGE_BASE (base: $BASE_REF)"
          DIFF=$(git clang-format --binary clang-format --diff "$MERGE_BASE" -- src/ 2>/dev/null || true)
          if [ -z "$DIFF" ] \
            || [ "$DIFF" = "no modified files to format" ] \
            || [ "$DIFF" = "clang-format did not modify any files" ]; then
            echo "clang-format: changed lines in src/ are correctly formatted."
            exit 0
          fi
          echo "$DIFF"
          echo "::error::clang-format would reformat changed lines in src/. Locally run: git clang-format $MERGE_BASE -- src/"
          exit 1

  # Time-boxed libFuzzer smoke run. Builds the clang-only SLS_FUZZ flavor against the
  # SAME canonical libsrt as the Dockerfile (CERALIVE/srt, pinned by commit) and runs
  # each of the four network-boundary fuzz targets for a FIXED 60s budget against the
  # committed seed corpus, failing on any crash. This is a SMOKE run, not a campaign:
  # 4 x 60s = 4 minutes of fuzzing keeps it minutes, not hours, so it is never a long
  # pole on a PR. Any crash-* / oom-* / timeout-* / leak-* unit libFuzzer persists is
  # uploaded as an artifact so a failing run is reproducible from the bytes.
  fuzz:
    name: fuzz (libFuzzer smoke)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      # Keep this in lockstep with the Dockerfile's ARG SRT_COMMIT: the fuzz build must
      # link the SAME libsrt the production image uses, so a crash found here reproduces
      # against the shipping parser byte-for-byte.
      SRT_COMMIT: d487b13365205b6cd5da9d9b50868c323e255b7c
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build + clang/libFuzzer tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake tcl pkg-config \
            libssl-dev zlib1g-dev \
            clang ccache
          clang --version

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-clang-fuzz-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-fuzz-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      # Canonical libsrt: CERALIVE/srt, pinned by commit and built exactly as the
      # Dockerfile does (./configure && make && make install). Cached by the pinned
      # commit so it only rebuilds when SRT_COMMIT changes.
      - name: Cache SRT CERALIVE build
        id: cache-srt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/srt-ceralive
          key: srt-ceralive-${{ runner.os }}-${{ env.SRT_COMMIT }}

      - name: Build SRT CERALIVE fork
        if: steps.cache-srt.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/CERALIVE/srt.git /tmp/srt
          cd /tmp/srt
          git checkout ${SRT_COMMIT}
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=/usr/local/srt-ceralive
          make -j$(nproc)
          sudo make install

      - name: Expose SRT to the build
        run: |
          echo "CPATH=/usr/local/srt-ceralive/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/srt-ceralive/lib/pkgconfig" >> $GITHUB_ENV

      - name: Cache vendored libs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lib
          key: vendor-libs-${{ hashFiles('.gitmodules') }}-${{ hashFiles('lib/**/.git') }}

      # Dedicated clang-only fuzz flavor: SLS_FUZZ instruments the whole tree with
      # fuzzer-no-link/ASan/UBSan and links the libFuzzer driver into each target. It is
      # mutually exclusive with SLS_SANITIZE/SLS_TSAN and requires clang (CMake enforces
      # both), so it lives in its own job/build dir.
      - name: Configure (SLS_FUZZ, clang)
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=Release \
            -DSLS_FUZZ=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build fuzz targets
        run: cmake --build build-fuzz --target fuzz_ts_parser fuzz_timecode fuzz_streamid fuzz_conf -j

      # Run EACH target for a fixed 60s against the committed seed corpus. A writable
      # workdir is passed FIRST so the committed corpus stays pristine and is where any
      # crash-* unit lands; -close_fd_mask=1 closes the parser's stdout chatter while
      # libFuzzer / ASan keep stderr; UBSAN_OPTIONS suppressions only silence one benign,
      # documented signed-shift finding (it does not affect crash detection). A non-zero
      # exit from any target (a crash) fails the job.
      - name: Fuzz smoke (60s per target; logs + fuzz-findings artifact)
        run: |
          mkdir -p fuzz-findings
          status=0
          for t in ts_parser:ts timecode:timecode streamid:streamid conf:conf; do
            target="fuzz_${t%%:*}"
            corpus="tests/fuzz/corpus/${t##*:}"
            work="fuzz-findings/${t%%:*}"
            mkdir -p "$work"
            echo "::group::$target (60s)"
            UBSAN_OPTIONS=suppressions=tests/fuzz/ubsan_suppressions.txt \
              ./build-fuzz/bin/"$target" -max_total_time=60 -close_fd_mask=1 \
              "$work" "$corpus" || { echo "::error::$target crashed"; status=1; }
            echo "::endgroup::"
          done
          if ls fuzz-findings/*/crash-* fuzz-findings/*/oom-* \
                fuzz-findings/*/timeout-* fuzz-findings/*/leak-* >/dev/null 2>&1; then
            echo "::error::libFuzzer persisted crash units (see the fuzz-findings artifact)."
            status=1
          fi
          exit $status

      # Persist any crash / oom / timeout / leak units libFuzzer wrote so a failing run is
      # reproducible from the exact bytes. On a clean run nothing matches and the upload is
      # a no-op (if-no-files-found: ignore).
      - name: Upload fuzz findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-findings
          path: |
            fuzz-findings/**/crash-*
            fuzz-findings/**/oom-*
            fuzz-findings/**/timeout-*
            fuzz-findings/**/leak-*
          if-no-files-found: ignore

  # Report-only code-coverage measurement. Builds the dedicated SLS_COVERAGE flavor
  # (--coverage / -O0, which CMake refuses to fuse with the sanitizers or a Release
  # build), runs the suite to exercise the instrumented binaries, and renders a gcovr
  # summary uploaded as an artifact. There is NO threshold gate and the suite run is
  # not allowed to fail the job (build-and-test is the canonical test gate), so this
  # job never blocks a merge on a coverage number.
  coverage:
    name: coverage (gcovr, report-only)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      # Same canonical libsrt as the build-and-test / fuzz jobs and the Dockerfile.
      SRT_COMMIT: d487b13365205b6cd5da9d9b50868c323e255b7c
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build + coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake tcl pkg-config \
            libssl-dev zlib1g-dev gcovr ccache

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-gcc-coverage-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc-coverage-

      - name: Configure bounded ccache
        run: ccache -M "$CCACHE_MAXSIZE"

      - name: Cache SRT CERALIVE build
        id: cache-srt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/srt-ceralive
          key: srt-ceralive-${{ runner.os }}-${{ env.SRT_COMMIT }}

      - name: Build SRT CERALIVE fork
        if: steps.cache-srt.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/CERALIVE/srt.git /tmp/srt
          cd /tmp/srt
          git checkout ${SRT_COMMIT}
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=/usr/local/srt-ceralive
          make -j$(nproc)
          sudo make install

      - name: Expose SRT to the build
        run: |
          echo "CPATH=/usr/local/srt-ceralive/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/srt-ceralive/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/local/srt-ceralive/lib/pkgconfig" >> $GITHUB_ENV

      - name: Cache vendored libs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lib
          key: vendor-libs-${{ hashFiles('.gitmodules') }}-${{ hashFiles('lib/**/.git') }}

      # Dedicated coverage build directory. SLS_COVERAGE adds --coverage
      # (-fprofile-arcs -ftest-coverage) at -O0 and is mutually exclusive with the
      # sanitizers (CMake FATAL_ERRORs if fused), so the coverage flags never reach a
      # Release or sanitizer build.
      - name: Configure (SLS_COVERAGE)
        run: |
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSLS_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSLS_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage -j

      # Run the suite only to drive the instrumented binaries so they emit .gcda
      # counters. `|| true` keeps a failing/flaky test from failing this report-only
      # job — the build-and-test matrix is the authoritative test gate.
      - name: Test (exercise instrumented binaries)
        run: ctest --test-dir build-coverage --output-on-failure || true

      # Render the gcovr summary (text to the log + HTML + Cobertura XML artifact),
      # scoped to src/ by excluding vendored lib/ and the tests themselves. `|| true`
      # guarantees a coverage shortfall never fails the job (no threshold gate).
      - name: gcovr report
        run: |
          mkdir -p coverage-report
          gcovr --root . \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --exclude 'lib/' \
            --exclude 'tests/' \
            --print-summary \
            --txt coverage-report/coverage.txt \
            --html-details coverage-report/coverage.html \
            --xml coverage-report/coverage.xml \
            build-coverage || true
          echo "----- coverage summary -----"
          cat coverage-report/coverage.txt || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: ignore
