name: Publish Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semver release tag equal to CMake PROJECT_VERSION (e.g., 3.1.0)"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character lowercase commit SHA to build from main."
        required: true
        type: string

concurrency:
  group: publish-irl-srt-server-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REF: ghcr.io/ceralive/irl-srt-server

jobs:
  release-gate:
    name: Release gate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout the expected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Validate release context
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash scripts/validate-image-release.sh \
            "${RELEASE_TAG}" "${EXPECTED_SHA}" "${GITHUB_REF}" "origin/main"

      - name: Check repository contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/check-tracked-workspace-evidence.sh
          bash scripts/check-srt-pin.sh
          bash scripts/test-image-publish-contracts.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and test production image
        run: |
          docker buildx build \
            --load \
            --platform "linux/${{ matrix.arch }}" \
            --tag "irl-srt-server:release-gate-${{ matrix.arch }}" \
            --cache-from "type=gha,scope=release-gate-${{ matrix.arch }}" \
            --cache-to "type=gha,scope=release-gate-${{ matrix.arch }},mode=max" \
            .

      # Shipped-binary verification against the CERALIVE/srt pin. The image must
      # ship srt_server, must link the pinned libsrt (banner version), and must
      # bring up the SRTLA listener with SRTO_SRTLAPATCHES ACCEPTED — that last
      # line is what distinguishes the CERALIVE fork from a stock libsrt, which
      # cannot even compile this source (see the ci.yml stock-libsrt leg).
      # The shipped sls.conf carries CRLF line endings that the conf parser
      # rejects, so it is normalized into a scratch copy before booting.
      - name: Verify production image
        run: |
          image="irl-srt-server:release-gate-${{ matrix.arch }}"
          docker run --rm --entrypoint sh "${image}" -c 'ls -l /usr/local/bin/srt_server'
          docker run --rm --entrypoint sh "${image}" -c '
            sed "s/\r$//" /etc/sls/sls.conf > /tmp/sls.conf
            timeout 6 srt_server -c /tmp/sls.conf > /tmp/boot.log 2>&1 || true
            cat /tmp/boot.log
            grep -q "Initialized libsrt v1.5.7" /tmp/boot.log
            grep -q "srtla_patches=on" /tmp/boot.log
            ! grep -q "SRTO_SRTLAPATCHES failure" /tmp/boot.log
          '

  publish:
    name: Publish and sign immutable manifest
    runs-on: ubuntu-latest
    needs: release-gate
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the expected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Revalidate exact release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash scripts/validate-image-release.sh \
            "${RELEASE_TAG}" "${EXPECTED_SHA}" "${GITHUB_REF}" "origin/main"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing tags
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          bash scripts/check-image-tags-unused.sh \
            "${IMAGE_REF}" "${RELEASE_TAG}" "${EXPECTED_SHA}"

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ceralive/irl-srt-server:${{ inputs.release_tag }}
            ghcr.io/ceralive/irl-srt-server:sha-${{ inputs.expected_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        # Upstream does not publish a floating v4 ref. Pin the immutable commit
        # behind the latest stable v4 tag so runner setup can resolve the action.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify published tags resolve to the captured digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          for tag in "${RELEASE_TAG}" "sha-${EXPECTED_SHA}"; do
            resolved_digest="$(
              docker buildx imagetools inspect "${IMAGE_REF}:${tag}" --raw |
                sha256sum |
                awk '{print "sha256:" $1}'
            )"
            test "${resolved_digest}" = "${DIGEST}" || {
              echo "::error::${IMAGE_REF}:${tag} resolved to ${resolved_digest}, expected ${DIGEST}"
              exit 1
            }
          done

      - name: Sign and verify manifest digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::build did not return a valid manifest digest"
            exit 1
          }

          cosign sign --yes "${IMAGE_REF}@${DIGEST}"
          cosign verify \
            --certificate-identity \
            "https://github.com/CERALIVE/irl-srt-server/.github/workflows/publish-image.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}@${DIGEST}"

          {
            echo "## Immutable irl-srt-server image"
            echo
            echo "- Release tag: \`ghcr.io/ceralive/irl-srt-server:${{ inputs.release_tag }}\`"
            echo "- Commit tag: \`ghcr.io/ceralive/irl-srt-server:sha-${{ inputs.expected_sha }}\`"
            echo "- Signed digest: \`${IMAGE_REF}@${DIGEST}\`"
            echo "- Keyless signature: verified against this workflow on \`main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
