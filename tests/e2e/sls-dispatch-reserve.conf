# Loopback config for the dispatch-reservation phase of
# tests/e2e/player_admission.sh. One worker with 6 slots, 2 held back: the two
# listeners, the publisher and one unreserved player fill the open band.
srt {
    worker_threads 1;
    worker_connections 6;
    worker_reserved_connections 2;
    http_port 8286;
    http_bind_addr 127.0.0.1;
    api_keys player-admission-test-key;
    log_level info;
    pidfile /tmp/sls_player_admission.pid;

    server {
        listen_player 5702;
        listen_publisher 5703;
        latency_min 200;
        latency_max 5000;
        domain_player play;
        domain_publisher publish;
        default_sid publish/live/feed1;
        backlog 100;
        idle_streams_timeout 30;
        on_event_url http://127.0.0.1:8296/admission/e2ePathSecret0;

        app {
            app_player live;
            app_publisher live;
            allow publish all;
            allow play all;
        }
    }
}
