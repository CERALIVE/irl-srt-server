# Loopback config for tests/e2e/log_resilience.sh. Debug logging makes every
# handshake log several lines, so a handshake flood overruns the log queue.
srt {
    worker_threads 1;
    worker_connections 300;
    http_port 8288;
    http_bind_addr 127.0.0.1;
    api_keys log-resilience-test-key;
    log_level debug;
    pidfile /tmp/sls_log_resilience.pid;

    server {
        listen_player 5720;
        listen_publisher 5721;
        latency_min 200;
        latency_max 5000;
        domain_player play;
        domain_publisher publish;
        default_sid publish/live/feed1;
        backlog 1024;
        idle_streams_timeout 30;

        app {
            app_player live;
            app_publisher live;
            allow publish all;
            allow play all;
        }
    }
}
