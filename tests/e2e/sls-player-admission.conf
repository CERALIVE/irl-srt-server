# Loopback config for tests/e2e/player_admission.sh: per-session player kicks,
# authorized-only player limits and pending caps. The API key and the hook
# path segment are test values, never production secrets.
srt {
    worker_threads 2;
    worker_connections 100;
    http_port 8286;
    http_bind_addr 127.0.0.1;
    api_keys player-admission-test-key;
    log_level info;
    pidfile /tmp/sls_player_admission.pid;

    server {
        listen_player 5700;
        listen_publisher 5701;
        latency_min 200;
        latency_max 5000;
        domain_player play;
        domain_publisher publish;
        default_sid publish/live/feed1;
        backlog 100;
        idle_streams_timeout 30;
        on_event_url http://127.0.0.1:8296/admission/e2ePathSecret0;
        player_pending_max_per_stream 4;
        # The harness is all loopback, so loopback must count to exercise the cap.
        player_pending_count_loopback 1;

        app {
            app_player live;
            app_publisher live;
            allow publish all;
            allow play all;
            max_players_per_stream 2;
        }
    }
}
