srt {
    worker_threads 1;
    worker_connections 100;
    http_port 8284;
    http_bind_addr 127.0.0.1;
    api_keys publisher-auth-test-key;
    log_level info;
    pidfile /tmp/sls_publisher_auth_probation.pid;

    server {
        listen_player 5600;
        listen_publisher 5601;
        latency_min 200;
        latency_max 5000;
        domain_player play;
        domain_publisher publish;
        default_sid publish/live/feed1;
        backlog 100;
        idle_streams_timeout 30;
        publisher_first_data_grace 1000;
        on_event_url http://127.0.0.1:8294/admission;

        app {
            app_player live;
            app_publisher live;
            allow publish all;
            allow play all;
        }
    }
}
