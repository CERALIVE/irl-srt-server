# Loopback config for phase 8 of tests/e2e/player_admission.sh: one worker
# with 6 slots, 2 of them reserved, so after a reload drops the two listeners
# the remaining 4 roles leave only the reserved band. Loopback counts as public,
# so only the resolver's {"reserved": true} makes a reader internal. The API
# key, the hook path segments and the player keys are test values, never
# production secrets.
srt {
    worker_threads 1;
    worker_connections 6;
    worker_reserved_connections 2;
    http_port 8286;
    http_bind_addr 127.0.0.1;
    api_keys player-admission-test-key;
    log_level info;
    pidfile /tmp/sls_player_admission.pid;

    server {
        listen_player 5706;
        listen_publisher 5707;
        latency_min 200;
        latency_max 5000;
        domain_player play;
        domain_publisher publish;
        default_sid publish/live/feed1;
        backlog 100;
        idle_streams_timeout 30;
        on_event_url http://127.0.0.1:8296/admission/e2ePathSecret0;
        player_key_auth_url http://127.0.0.1:8296/sls/player-key/e2eKeySecret0;
        player_pending_count_loopback 1;

        app {
            app_player live;
            app_publisher live;
            allow publish all;
            allow play all;
        }
    }
}
