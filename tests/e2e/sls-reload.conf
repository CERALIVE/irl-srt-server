# Loopback config for tests/e2e/reload_under_load.sh. Test-only API key and
# hook path segment.
srt {
    worker_threads 2;
    worker_connections 100;
    http_port 8287;
    http_bind_addr 127.0.0.1;
    api_keys reload-test-key;
    log_level info;
    pidfile /tmp/sls_reload_under_load.pid;

    server {
        listen_player 5710;
        listen_publisher 5711;
        latency_min 200;
        latency_max 5000;
        domain_player play;
        domain_publisher publish;
        default_sid publish/live/feed1;
        backlog 100;
        idle_streams_timeout 30;
        on_event_url http://127.0.0.1:8297/admission/e2eReloadSecret;

        app {
            app_player live;
            app_publisher live;
            allow publish all;
            allow play all;
        }
    }
}
